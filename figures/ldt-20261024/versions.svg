<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img"><title>版本更新前的回歸測試與差異審查概念流程</title><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="30" y="35" font-size="25" fill="#183b40" text-anchor="start">相同比對檔，不同軟體／參數可能得到不同候選</text><rect x="25" y="95" width="180" height="80" rx="5" fill="#e1edeb" stroke="none"/><text x="115.0" y="143.0" font-size="23" fill="#183b40" text-anchor="middle">固定測試資料</text><rect x="270" y="65" width="185" height="65" rx="5" fill="#e1edeb" stroke="none"/><text x="362.5" y="105.5" font-size="23" fill="#183b40" text-anchor="middle">現行版本 v1</text><rect x="270" y="175" width="185" height="65" rx="5" fill="#e1edeb" stroke="none"/><text x="362.5" y="215.5" font-size="23" fill="#183b40" text-anchor="middle">候選版本 v2</text><rect x="515" y="95" width="160" height="145" rx="5" fill="#e1edeb" stroke="none"/><text x="595.0" y="175.5" font-size="23" fill="#183b40" text-anchor="middle">差異審查</text><line x1="205" y1="135" x2="260" y2="100" stroke="#496568" stroke-width="2" stroke-dasharray=""/><line x1="205" y1="135" x2="260" y2="205" stroke="#496568" stroke-width="2" stroke-dasharray=""/><line x1="455" y1="100" x2="505" y2="135" stroke="#496568" stroke-width="2" stroke-dasharray=""/><line x1="455" y1="205" x2="505" y2="185" stroke="#496568" stroke-width="2" stroke-dasharray=""/><text x="350" y="290" font-size="24" fill="#183b40" text-anchor="middle">新增／消失／VAF／註解／QC 差異，都要有原因</text><text x="350" y="337" font-size="23" fill="#183b40" text-anchor="middle">通過預設標準 → 核准上線；失敗 → 保留 v1 並排查</text></g></svg>