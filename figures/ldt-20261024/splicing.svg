<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img"><title>可變剪接示意：同一基因有包含或跳過 E2 的 RNA 形式</title><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="30" y="32" font-size="25" fill="#183b40" text-anchor="start">同一基因，總量與組裝方式是兩個問題</text><text x="20" y="128" font-size="24" fill="#183b40" text-anchor="start">形式 A</text><line x1="155" y1="116" x2="660" y2="116" stroke="#739192" stroke-width="3" stroke-dasharray=""/><rect x="160" y="90" width="110" height="52" rx="5" fill="#087c83" stroke="none"/><text x="215" y="125" font-size="26" fill="#ffffff" text-anchor="middle">E1</text><rect x="355" y="90" width="110" height="52" rx="5" fill="#087c83" stroke="none"/><text x="410" y="125" font-size="26" fill="#ffffff" text-anchor="middle">E2</text><rect x="550" y="90" width="110" height="52" rx="5" fill="#087c83" stroke="none"/><text x="605" y="125" font-size="26" fill="#ffffff" text-anchor="middle">E3</text><text x="20" y="258" font-size="24" fill="#183b40" text-anchor="start">形式 B</text><line x1="155" y1="246" x2="660" y2="246" stroke="#739192" stroke-width="3" stroke-dasharray=""/><rect x="160" y="220" width="110" height="52" rx="5" fill="#087c83" stroke="none"/><text x="215" y="255" font-size="26" fill="#ffffff" text-anchor="middle">E1</text><rect x="550" y="220" width="110" height="52" rx="5" fill="#087c83" stroke="none"/><text x="605" y="255" font-size="26" fill="#ffffff" text-anchor="middle">E3</text><path d="M215 218 Q410 187 605 218" fill="none" stroke="#a94b27" stroke-width="4"/><text x="410" y="183" font-size="23" fill="#a94b27" text-anchor="middle">E1–E3 junction</text><text x="350" y="330" font-size="21" fill="#183b40" text-anchor="middle">E1 內的 read：支持基因表現；跨 E1–E3：支持局部跳躍</text><text x="350" y="367" font-size="20" fill="#183b40" text-anchor="middle">概念圖，非實際基因座標；不是 DNA 缺失的直接證據</text></g></svg>